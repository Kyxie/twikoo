name: Sync upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main
        id: merge
        run: |
          git remote add upstream https://github.com/twikoojs/twikoo.git
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Upstream is already merged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge --no-ff --no-edit upstream/main; then
            echo "::error::Upstream merge failed. Resolve these conflicts manually:"
            git diff --name-only --diff-filter=U
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        if: steps.merge.outputs.changed == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: steps.merge.outputs.changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: steps.merge.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify merged code
        if: steps.merge.outputs.changed == 'true'
        run: |
          pnpm build
          pnpm lint
          pnpm lint:md
          pnpm typecheck
          pnpm test
          pnpm --filter twikoo-docs docs:build

      - name: Push main
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:main
